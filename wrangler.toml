name = "osint-tg-bot"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
BOT_USERNAME = "your_bot"

# KV для кэша и вебхук-секрета
[[kv_namespaces]]
binding = "OSINT_KV"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_ID"

# Секреты (задаются через wrangler secret put / GitHub Secrets):
# BOT_TOKEN       — токен от @BotFather
# WEBHOOK_SECRET  — случайная строка для валидации
# HIBP_API_KEY    — ключ haveibeenpwned.com (опционально)
